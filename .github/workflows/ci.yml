name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The supervisor is loopback TCP and spawns detached processes, so it
        # is worth proving on every platform we claim to support rather than
        # only on Linux.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npx vsce package --no-dependencies

  extension-smoke:
    name: Extension Development Host smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # test-electron runs a real desktop binary. GitHub's Linux image needs a
      # virtual display; the test itself has no agent credentials or networked
      # ACP dependencies beyond downloading the pinned VS Code release.
      - name: Extension Development Host smoke test
        run: xvfb-run -a npm run test:extension
